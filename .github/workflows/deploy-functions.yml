name: Deploy Edge Functions

on:
  push:
    branches: [main]
    paths:
      - 'supabase/functions/**'

jobs:
  deploy-functions:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Detectar e fazer deploy das functions alteradas
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          set -e
          PROJECT_REF=htpcqdbhktmvppfemnad
          BEFORE="${{ github.event.before }}"

          if [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || [ -z "$BEFORE" ]; then
            echo "Push sem SHA anterior valido (ex.: branch nova) -- nao arrisca deploy em massa, pare e avise."
            exit 1
          fi

          CHANGED=$(git diff --name-only "$BEFORE" "${{ github.sha }}" -- supabase/functions/)
          echo "Arquivos alterados em supabase/functions/:"
          echo "$CHANGED"

          if echo "$CHANGED" | grep -q '^supabase/functions/_shared/'; then
            echo ""
            echo "Arquivo em _shared/ mudou -- fazendo deploy de TODAS as functions (nao da pra saber com seguranca quem depende de que arquivo compartilhado)"
            FUNCTIONS=$(find supabase/functions -mindepth 1 -maxdepth 1 -type d ! -name '_shared' -printf '%f\n')
          else
            FUNCTIONS=$(echo "$CHANGED" | awk -F/ '{print $3}' | sort -u | grep -v '^_shared$' | grep -v '^$' || true)
          fi

          if [ -z "$FUNCTIONS" ]; then
            echo "Nenhuma pasta de function pra deployar (mudanca nao ficou dentro de uma pasta de function)"
            exit 0
          fi

          FAILED=""
          for fn in $FUNCTIONS; do
            if [ -d "supabase/functions/$fn" ]; then
              echo ""
              echo "== Deploy: $fn =="
              supabase functions deploy "$fn" --project-ref "$PROJECT_REF" || FAILED="$FAILED $fn"
            else
              echo "Pasta $fn nao existe mais (provavelmente apagada) -- pulando"
            fi
          done

          if [ -n "$FAILED" ]; then
            echo ""
            echo "Falhou o deploy de:$FAILED"
            exit 1
          fi
