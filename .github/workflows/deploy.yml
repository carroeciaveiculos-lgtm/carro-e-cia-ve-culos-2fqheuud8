name: Deploy producao

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - name: Instalar dependencias
        run: bun install

      - name: Lint
        run: bun run lint

      # Incidente 04/10/2026: o .env está no .gitignore, então o build do GitHub saía SEM o
      # endereço e a chave do Supabase e o site publicado abria em tela branca
      # ("supabaseUrl is required"). Os dois valores abaixo são PÚBLICOS (a mesma chave
      # anon já vai dentro do JavaScript do site para qualquer visitante) — não são segredos.
      - name: Build
        run: bun run build
        env:
          VITE_SUPABASE_URL: https://htpcqdbhktmvppfemnad.supabase.co
          VITE_SUPABASE_PUBLISHABLE_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imh0cGNxZGJoa3RtdnBwZmVtbmFkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzU5MzA0MzMsImV4cCI6MjA5MTUwNjQzM30.6Yu_iOYb7gs2wXrBc60fHCt3Nud1-PRK17SamqzJj2k

      # Trava: se o build não trouxe a URL do Supabase, NÃO publica (melhor falhar o deploy
      # do que colocar no ar um site em tela branca).
      - name: Conferir que o build trouxe a URL do Supabase
        run: |
          if ! grep -rqF "htpcqdbhktmvppfemnad.supabase.co" dist/assets; then
            echo "ERRO: o build não contém a URL do Supabase. Deploy cancelado."
            exit 1
          fi

      - name: Deploy no Cloudflare Workers
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: bun

      # Teste PÓS-DEPLOY (incidente de 04/10/2026): "deploy verde" só prova que os arquivos foram
      # enviados, não que o site abre. Aqui o Chrome do próprio GitHub abre o site PUBLICADO e confere
      # que o aplicativo desenhou algo. Falha o job (e o GitHub avisa por e-mail) se o #root ficar
      # vazio ou se aparecer a mensagem de emergência do index.html ("Estamos com um problema
      # temporário"). Tenta 4 vezes, esperando a Cloudflare propagar a versão nova.
      - name: Conferir que o site publicado abre (anti tela branca)
        run: |
          for tentativa in 1 2 3 4; do
            sleep 20
            google-chrome --headless=new --no-sandbox --disable-gpu --virtual-time-budget=15000 \
              --dump-dom https://www.carroeciamotors.com.br/ > dom.html 2>/dev/null || true
            tamanho=$(wc -c < dom.html)
            if [ "$tamanho" -gt 20000 ] \
              && ! grep -q '<div id="root"></div>' dom.html \
              && ! grep -q 'Estamos com um problema temporário' dom.html; then
              echo "OK: o site publicado renderizou (${tamanho} bytes)."
              exit 0
            fi
            echo "Tentativa ${tentativa}: o site ainda não renderizou (${tamanho} bytes)."
          done
          echo "ERRO: o site publicado NÃO renderiza (tela branca). Confira o deploy agora."
          exit 1
