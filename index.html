    <!-- Rede de segurança contra TELA BRANCA (incidente de 04/10/2026: o site foi publicado sem a
         configuração do Supabase, o aplicativo quebrou ao abrir e o visitante via só branco).
         Script independente do aplicativo: se em 8 segundos o #root continuar vazio, mostra uma
         mensagem com botão de recarregar e registra o problema no console. Se o aplicativo montar
         depois disso, o React simplesmente substitui a mensagem. -->

      window.setTimeout(function () {
        var raiz = document.getElementById("root");
        if (!raiz || raiz.childElementCount > 0) return;
        console.error(
          "[Carro e Cia] O aplicativo não carregou em 8 segundos (tela branca evitada). " +
            "Causa provável: erro ao iniciar (ex.: configuração do Supabase ausente no build).",
        );

          '<div style="font-family:system-ui,sans-serif;max-width:420px;margin:15vh auto;padding:24px;text-align:center;color:#1a1a1a">' +
